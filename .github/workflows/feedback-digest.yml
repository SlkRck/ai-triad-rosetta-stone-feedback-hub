name: Feedback — weekly digest

# Compiles all open "feedback" issues into docs/FEEDBACK-SUMMARY.md so the
# creator has one rolling view. Runs weekly and on manual trigger.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'feedback',
              per_page: 100
            });
            let md = `# AI Rosetta Stone — Feedback Summary\n\n`;
            md += `_Generated ${new Date().toISOString().slice(0,10)} · ${issues.length} open feedback item(s)._\n\n`;
            for (const i of issues) {
              md += `## #${i.number} — ${i.title}\n`;
              md += `${i.html_url} · opened ${i.created_at.slice(0,10)}\n\n`;
              const body = (i.body || '').trim();
              md += body ? body.slice(0, 1500) + (body.length > 1500 ? '\n\n…(truncated)\n' : '\n') : '_(no body)_\n';
              md += `\n---\n\n`;
            }
            fs.mkdirSync('docs', { recursive: true });
            fs.writeFileSync('docs/FEEDBACK-SUMMARY.md', md);

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/FEEDBACK-SUMMARY.md
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh feedback summary"
            git push
          fi
