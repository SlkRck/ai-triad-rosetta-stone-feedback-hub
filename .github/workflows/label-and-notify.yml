name: Feedback — label & notify

# Runs when an issue is opened or labeled. Ensures feedback issues carry the
# "feedback" label and posts an optional notification to a Teams/Slack webhook.
#
# Setup:
#   - Optional: add a repo secret named FEEDBACK_WEBHOOK_URL (Teams/Slack incoming
#     webhook). If absent, the notify step is skipped.
#   - The tool creator should "Watch" the repo (Custom > Issues) to get emails.

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure "feedback" label
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || '').toLowerCase();
            const body  = (context.payload.issue.body  || '').toLowerCase();
            const looksLikeFeedback =
              title.startsWith('feedback') ||
              body.includes('submitted via the ai rosetta stone feedback hub') ||
              (context.payload.issue.labels || []).some(l => l.name === 'feedback');
            if (looksLikeFeedback) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['feedback']
              });
            }

      - name: Notify webhook (optional)
        if: ${{ env.WEBHOOK != '' }}
        env:
          WEBHOOK: ${{ secrets.FEEDBACK_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"📝 New AI Rosetta Stone feedback: ${ISSUE_TITLE} — ${ISSUE_URL}\"}" \
            "$WEBHOOK" || echo "notify failed (non-fatal)"
